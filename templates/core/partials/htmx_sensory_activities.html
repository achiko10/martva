{% if systems %}
<div class="space-y-4">
    {% for system in systems %}
    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200/80">
        <!-- System Header -->
        <div class="flex items-center space-x-2 mb-3">
            <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wide">{{ system.name }}</h4>
        </div>

        <!-- Activities Quick Chips -->
        <div class="flex flex-wrap gap-2">
            {% for act in system.activities.all %}
            {% if act.is_active %}
            <label class="cursor-pointer">
                <input type="checkbox" name="activities" value="{{ act.id }}" class="sr-only peer chip-checkbox">
                <span class="inline-block px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-200 text-slate-700 bg-white hover:bg-slate-100 peer-checked:bg-teal-600 peer-checked:text-white peer-checked:border-teal-600 transition shadow-sm">
                    {{ act.name }}
                </span>
            </label>
            {% endif %}
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
